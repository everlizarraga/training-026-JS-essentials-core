<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatApp</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1d21;
      color: #dcddde;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: #2f3136;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #202225;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .rooms {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .room-item {
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .room-item:hover {
      background: #393c43;
    }

    .room-item.active {
      background: #404249;
      color: #fff;
    }

    .room-icon {
      font-size: 1rem;
    }

    .btn-add-room {
      margin: 12px 16px;
      padding: 8px;
      background: #5865f2;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Main Chat */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #36393f;
    }

    /* Chat Header */
    .chat-header {
      height: 50px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #202225;
      background: #36393f;
    }

    .room-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-box {
      position: relative;
    }

    .search-input {
      padding: 6px 32px 6px 10px;
      background: #202225;
      border: 1px solid #202225;
      border-radius: 4px;
      color: #dcddde;
      font-size: 0.85rem;
      width: 200px;
    }

    .search-input:focus {
      outline: none;
      border-color: #5865f2;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      background: #202225;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .user-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
    }

    /* Messages Area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .messages-area::-webkit-scrollbar {
      width: 8px;
    }

    .messages-area::-webkit-scrollbar-track {
      background: #2f3136;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: #202225;
      border-radius: 4px;
    }

    /* Message */
    .message {
      margin-bottom: 16px;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .message:hover {
      background: #32353b;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .message-author {
      font-weight: 600;
      color: #fff;
      font-size: 0.95rem;
    }

    .message-time {
      font-size: 0.7rem;
      color: #72767d;
    }

    .message-content {
      color: #dcddde;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .message-content strong {
      font-weight: 700;
      color: #fff;
    }

    .message-content em {
      font-style: italic;
    }

    .message-content code {
      background: #2f3136;
      padding: 2px 4px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
    }

    .message-footer {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      align-items: center;
    }

    .reactions {
      display: flex;
      gap: 4px;
    }

    .reaction {
      padding: 2px 8px;
      background: #2f3136;
      border: 1px solid #202225;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reaction:hover {
      border-color: #5865f2;
    }

    .reaction.active {
      background: #5865f2;
      border-color: #5865f2;
    }

    .btn-reply {
      background: none;
      border: none;
      color: #72767d;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-reply:hover {
      background: #2f3136;
      color: #dcddde;
    }

    .btn-delete-msg {
      background: none;
      border: none;
      color: #72767d;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-delete-msg:hover {
      color: #f04747;
    }

    /* Thread */
    .thread {
      margin-left: 48px;
      margin-top: 8px;
      padding-left: 12px;
      border-left: 2px solid #4f545c;
    }

    .thread-toggle {
      background: none;
      border: none;
      color: #5865f2;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px 0;
      font-weight: 600;
    }

    .thread-toggle:hover {
      text-decoration: underline;
    }

    /* Input Area */
    .input-area {
      padding: 16px;
      background: #40444b;
    }

    .message-input-wrap {
      background: #40444b;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #202225;
    }

    .message-input {
      width: 100%;
      background: none;
      border: none;
      color: #dcddde;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      outline: none;
    }

    .message-input::placeholder {
      color: #72767d;
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.75rem;
      color: #72767d;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #72767d;
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    /* Presence indicator */
    .presence {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-left: 4px;
    }

    .presence.online {
      background: #43b581;
    }

    .presence.offline {
      background: #747f8d;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        💬 ChatApp
      </div>

      <div id="rooms-list" class="rooms">
        <!-- Se renderiza dinámicamente -->
        <div class="room-item active" data-id="general">
          <span class="room-icon">#</span>
          <span>general</span>
        </div>
        <div class="room-item" data-id="random">
          <span class="room-icon">#</span>
          <span>random</span>
        </div>
      </div>

      <button id="btn-add-room" class="btn-add-room">
        ➕ Add Room
      </button>
    </div>

    <!-- Main Chat -->
    <div class="main-chat">

      <!-- Header -->
      <div class="chat-header">
        <div class="room-title">
          <span id="active-room-title"># general</span>
        </div>
        <div class="header-controls">
          <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="Search messages...">
          </div>
          <div class="user-badge">
            <div class="user-avatar">U</div>
            <span id="username-display">@user</span>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div id="messages-area" class="messages-area">
        <!-- Se renderiza dinámicamente -->

        <!-- EJEMPLO de mensaje -->
        <div class="message" data-id="msg-1">
          <div class="message-header">
            <span class="message-author">@alice</span>
            <span class="message-time">10:30 AM</span>
          </div>
          <div class="message-content">
            Hey team! 👋 This is **working** great!
          </div>
          <div class="message-footer">
            <div class="reactions">
              <span class="reaction">❤️ 2</span>
              <span class="reaction">👍 1</span>
            </div>
            <button class="btn-reply">💬 Reply</button>
            <button class="btn-delete-msg">🗑️</button>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="message-input-wrap">
          <textarea id="message-input" class="message-input" placeholder="Message #general" rows="1"></textarea>
        </div>
        <div class="input-footer">
          <span>💡 Tip: Use **bold**, *italic*, `code`</span>
          <span>/help for commands</span>
        </div>
      </div>

    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
