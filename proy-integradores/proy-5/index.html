<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 24px 20px;
      font-size: 1.5rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav {
      flex: 1;
      overflow-y: auto;
    }

    .nav-section {
      padding: 16px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-title {
      padding: 8px 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: 0.6;
      font-weight: 600;
    }

    .nav-item {
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.2);
      font-weight: 600;
    }

    .nav-icon {
      font-size: 1.2rem;
    }

    .btn-create-playlist {
      margin: 12px 20px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-create-playlist:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    /* Header */
    .content-header {
      padding: 24px 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .view-title {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .search-box {
      position: relative;
    }

    .search-input {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: white;
      font-size: 0.9rem;
      width: 300px;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }

    /* Song List */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-item {
      display: grid;
      grid-template-columns: 50px 1fr 200px 100px 50px;
      gap: 16px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .song-item.playing {
      background: rgba(255, 255, 255, 0.15);
    }

    .song-number {
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .song-artwork {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .song-details {
      flex: 1;
    }

    .song-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .song-artist {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .song-album {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .song-duration {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .song-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-favorite {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .btn-favorite:hover {
      opacity: 1;
    }

    .btn-favorite.active {
      opacity: 1;
      color: #ff6b6b;
    }

    /* Player (Bottom Bar) */
    .player {
      height: 90px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 16px;
      padding: 0 24px;
      align-items: center;
    }

    /* Now Playing */
    .now-playing {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .now-playing-artwork {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .now-playing-info {
      flex: 1;
    }

    .now-playing-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .now-playing-artist {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* Player Controls */
    .player-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .controls-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }

    .btn-control {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
      opacity: 0.8;
      transition: all 0.2s;
      padding: 8px;
    }

    .btn-control:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .btn-control.btn-play {
      font-size: 2rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-control.btn-play:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .btn-control.active {
      color: #667eea;
      opacity: 1;
    }

    .progress-bar-container {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .time {
      font-size: 0.75rem;
      opacity: 0.7;
      min-width: 40px;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: white;
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }

    /* Volume */
    .volume-control {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
    }

    .volume-icon {
      font-size: 1.2rem;
    }

    .volume-slider {
      width: 100px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .volume-slider-fill {
      height: 100%;
      background: white;
      border-radius: 2px;
      width: 100%;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      opacity: 0.6;
    }

    .empty-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    /* Scrollbar */
    .content-area::-webkit-scrollbar {
      width: 8px;
    }

    .content-area::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    .content-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        🎵 Music Player
      </div>

      <nav class="nav" id="nav">
        <!-- Navegación se renderiza dinámicamente -->

        <!-- EJEMPLO de nav items -->
        <div class="nav-section">
          <div class="nav-title">Library</div>
          <div class="nav-item active" data-view="all-songs">
            <span class="nav-icon">🎵</span>
            <span>All Songs</span>
          </div>
          <div class="nav-item" data-view="favorites">
            <span class="nav-icon">⭐</span>
            <span>Favorites</span>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-title">Playlists</div>
          <!-- Playlists se renderizan aquí -->
          <div class="nav-item" data-playlist-id="playlist-1">
            <span class="nav-icon">📋</span>
            <span>My Playlist</span>
          </div>
        </div>
      </nav>

      <button class="btn-create-playlist" id="btn-create-playlist">
        ➕ New Playlist
      </button>
    </div>

    <!-- Main Content -->
    <div class="main-content">

      <!-- Header -->
      <div class="content-header">
        <h1 class="view-title" id="view-title">All Songs</h1>
        <div class="search-box">
          <input type="text" class="search-input" id="search-input" placeholder="Search songs, artists...">
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area" id="content-area">
        <!-- Lista de canciones se renderiza aquí -->

        <!-- EJEMPLO de song item -->
        <div class="song-list">
          <div class="song-item" data-id="song-1">
            <div class="song-number">1</div>
            <div class="song-info">
              <div class="song-artwork">🎵</div>
              <div class="song-details">
                <div class="song-title">Bohemian Rhapsody</div>
                <div class="song-artist">Queen</div>
              </div>
            </div>
            <div class="song-album">A Night at the Opera</div>
            <div class="song-duration">5:55</div>
            <div class="song-actions">
              <button class="btn-favorite">♡</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Player (Bottom Bar) -->
  <div class="player">

    <!-- Now Playing -->
    <div class="now-playing">
      <div class="now-playing-artwork">🎵</div>
      <div class="now-playing-info">
        <div class="now-playing-title">No song playing</div>
        <div class="now-playing-artist">---</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="player-controls">
      <div class="controls-buttons">
        <button class="btn-control" id="btn-shuffle" title="Shuffle">
          🔀
        </button>
        <button class="btn-control" id="btn-prev">
          ⏮️
        </button>
        <button class="btn-control btn-play" id="btn-play">
          ▶️
        </button>
        <button class="btn-control" id="btn-next">
          ⏭️
        </button>
        <button class="btn-control" id="btn-repeat" title="Repeat">
          🔁
        </button>
      </div>

      <div class="progress-bar-container">
        <span class="time" id="current-time">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <span class="time" id="total-time">0:00</span>
      </div>
    </div>

    <!-- Volume -->
    <div class="volume-control">
      <span class="volume-icon">🔊</span>
      <div class="volume-slider" id="volume-slider">
        <div class="volume-slider-fill" id="volume-slider-fill"></div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
